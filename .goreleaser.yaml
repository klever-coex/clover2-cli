# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: clover2-cli

builds:
  - id: clover2-cli
    main: .
    binary: clover2-cli
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/klever-coex/clover2-cli/internal/cliapp.Version={{ .Version }}

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

nfpms:
  - id: clover2-cli
    package_name: clover2-cli
    file_name_template: "{{ .ConventionalFileName }}"
    maintainer: klever-coex
    description: Clover2 platform manager CLI
    homepage: https://github.com/klever-coex/clover2-cli
    formats:
      - deb
    contents:
      - src: packaging/clover2-agent@.service
        dst: /usr/lib/systemd/system/clover2-agent@.service
    scripts:
      postinstall: packaging/deb/postinst

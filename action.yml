name: Install clover2
description: Install the clover2 CLI and optionally compose the project version.

inputs:
  version:
    description: 'Release version to install (e.g. 0.1.0), latest by default'
    required: false
    default: latest
  repo:
    description: 'Repository to download the release from'
    required: false
    default: klever-coex/clover2-cli
  token:
    description: 'GitHub token for the download'
    required: false
    default: ${{ github.token }}
  detect-version:
    description: 'Also compose the project version into build_mode, git_hash and project_version outputs (needs tooling/tooling.json and fetched tags)'
    required: false
    default: false

outputs:
  version:
    description: 'Installed project version'
    value: ${{ steps.verify.outputs.version }}
  build_mode:
    description: 'Build mode (empty unless detect-version)'
    value: ${{ steps.compose.outputs.build_mode }}
  git_hash:
    description: 'Short git hash (empty unless detect-version)'
    value: ${{ steps.compose.outputs.git_hash }}
  project_version:
    description: 'Composed project version for the current ref (empty unless detect-version)'
    value: ${{ steps.compose.outputs.version }}

runs:
  using: composite
  steps:
    - name: Detect runner architecture
      id: arch
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64)  echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
          aarch64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::unsupported runner architecture: $(uname -m)"; exit 1 ;;
        esac

    - name: Download release binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ steps.arch.outputs.arch }}
      run: |
        if [[ "$VERSION" == "latest" ]]; then
          url="https://github.com/${REPO}/releases/latest/download/clover2-cli-linux-${ARCH}"
        else
          url="https://github.com/${REPO}/releases/download/v${VERSION}/clover2-cli-linux-${ARCH}"
        fi

        curl --fail --location --silent --show-error \
          --header "Authorization: Bearer ${GH_TOKEN}" \
          --output /tmp/clover2 "$url"

        chmod 0755 /tmp/clover2
        sudo install -m 0755 /tmp/clover2 /usr/local/bin/clover2

    - name: Verify
      id: verify
      shell: bash
      run: |
        clover2 --version
        echo "version=$(clover2 --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Compose project version
      id: compose
      if: ${{ inputs.detect-version }}
      shell: bash
      env:
        GITHUB_REF: ${{ github.ref }}
      run: |
        COMPOSE=$(clover2 version compose --root . --ref "$GITHUB_REF" --json)
        echo "compose: ${COMPOSE}"
        echo "build_mode=$(echo "${COMPOSE}" | jq -r .build_mode)" >> "$GITHUB_OUTPUT"
        echo "git_hash=$(echo "${COMPOSE}" | jq -r .git_hash)" >> "$GITHUB_OUTPUT"
        echo "version=$(echo "${COMPOSE}" | jq -r .version)" >> "$GITHUB_OUTPUT"

syntax = "proto3";

package clover2.robot.v1;

option go_package = "github.com/YOUR_ORG/clover2/protocol/gen/go/clover2/robot/v1;robotv1";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_FOUND = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_UNAVAILABLE = 4;
  ERROR_CODE_UNSUPPORTED = 5;
  ERROR_CODE_INTERNAL = 6;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}
